<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>论坛</title>
  <style>
    body { background:#fff; font-family:SimSun; font-size:14px; margin:0; padding:30px 20px; max-width:700px; margin:auto; }
    h1 { text-align:center; }
    .nav { text-align:center; margin-bottom:15px; }
    .nav a { color:#00c; margin:0 10px; cursor:pointer; text-decoration:underline; }
    table { width:100%; border-collapse:collapse; border:1px solid #999; }
    th,td { border:1px solid #999; padding:4px 6px; text-align:left; }
    .link { color:#00c; text-decoration:underline; cursor:pointer; }
    input,textarea { width:100%; border:1px solid #999; padding:3px; font-size:14px; box-sizing:border-box; }
    button { border:1px solid #999; background:#eee; padding:4px 16px; cursor:pointer; }
    .hidden { display:none; }
    .tip { text-align:center; color:#555; padding:15px; }
    .back-btn { position:absolute; top:15px; left:15px; font-size:28px; cursor:pointer; color:#00c; }
  </style>
</head>
<body>
  <button class="back-btn hidden" id="backBtn" onclick="goHome()">&#10094;</button>
  <h1>论坛</h1>
  <div class="nav" id="navBar">
    <a href="#" onclick="showNewPost()">发帖</a>
    <a href="#" onclick="showAllPosts()">浏览</a>
    <a href="#" onclick="showSearch()">搜索</a>
  </div>

  <div id="resultPanel" class="hidden"><div id="resultContent"></div></div>
  <div id="newPostPanel" class="hidden">
    <div>标题：<input type="text" id="postTitle"></div>
    <div style="margin-top:8px;">内容：<textarea id="postContent"></textarea></div>
    <div style="margin-top:8px;">昵称：<input type="text" id="postAuthor" value="游客"></div>
    <div style="margin-top:8px;"><button onclick="submitPost()">发布</button> <button onclick="goHome()">返回</button></div>
  </div>
  <div id="searchPanel" class="hidden">
    <div>搜索：<input type="text" id="searchInput" placeholder="关键词"><button onclick="searchPosts()">搜索</button></div>
    <div id="searchResults" style="margin-top:10px;"></div>
  </div>
  <div id="detailPanel" class="hidden"><div id="detailContent"></div></div>

  <script>
    // 你的 KVdb Bucket ID
    var BUCKET_ID = 'DHwa47crUubv8NbeJPF2y5';
    var API = 'https://kvdb.io/' + BUCKET_ID + '/posts';  // 使用单一键 'posts' 存储整个帖子数组

    function goHome() {
      document.getElementById('navBar').classList.remove('hidden');
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('searchPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
    }
    function showNewPost() {
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('newPostPanel').classList.remove('hidden');
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('searchPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
    }
    function showAllPosts() {
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('resultPanel').classList.remove('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('searchPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      loadPosts();
    }
    function showSearch() {
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('searchPanel').classList.remove('hidden');
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
    }
    function showDetail(postId) {
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('detailPanel').classList.remove('hidden');
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('searchPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      loadDetail(postId);
    }

    // 读取整个帖子数组
    async function getPostsArray() {
      try {
        let res = await fetch(API);
        if (res.status === 404) {
          // 如果还没有数据，初始化空数组并写入
          await fetch(API, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify([])
          });
          return [];
        }
        if (!res.ok) throw new Error('读取失败');
        return await res.json();
      } catch(e) {
        console.error(e);
        return [];
      }
    }

    // 写入整个帖子数组
    async function savePostsArray(posts) {
      try {
        let res = await fetch(API, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(posts)
        });
        return res.ok;
      } catch(e) {
        console.error(e);
        return false;
      }
    }

    async function loadPosts() {
      let posts = await getPostsArray();
      renderList(posts);
    }

    function renderList(posts) {
      let container = document.getElementById('resultContent');
      if (!posts || posts.length === 0) {
        container.innerHTML = '<p class="tip">暂无帖子</p>';
        return;
      }
      let html = '<table><tr><th>标题</th><th>作者</th><th>回复</th><th>赞</th><th>时间</th></tr>';
      posts.forEach(function(p) {
        html += '<tr><td><a class="link" onclick="showDetail(\'' + p.id + '\')">' + esc(p.title) + '</a></td><td>' + esc(p.author) + '</td><td>' + (p.replies ? p.replies.length : 0) + '</td><td>' + (p.likes || 0) + '</td><td>' + formatTime(p.createdOn) + '</td></tr>';
      });
      html += '</table>';
      container.innerHTML = html;
    }

    async function loadDetail(postId) {
      let posts = await getPostsArray();
      let p = posts.find(item => item.id === postId);
      if (!p) {
        document.getElementById('detailContent').innerHTML = '<p class="tip">帖子不存在</p>';
        return;
      }
      let html = '<h3>' + esc(p.title) + '</h3><p>作者：' + esc(p.author) + ' | 时间：' + formatTime(p.createdOn) + ' | <a class="link" onclick="likePost(\'' + p.id + '\')">点赞（' + (p.likes||0) + '）</a></p><hr><p>' + esc(p.content) + '</p><hr><h4>回复：</h4>';
      if (p.replies && p.replies.length) {
        p.replies.forEach(function(r) {
          html += '<div><b>' + esc(r.author) + ':</b> ' + esc(r.content) + '</div>';
        });
      } else {
        html += '<p class="tip">暂无回复</p>';
      }
      html += '<div style="margin-top:10px;">回复：<input type="text" id="replyContent"><br>昵称：<input type="text" id="replyAuthor" value="游客"><br><button onclick="addReply(\'' + p.id + '\')">提交回复</button></div>';
      document.getElementById('detailContent').innerHTML = html;
    }

    async function submitPost() {
      let title = document.getElementById('postTitle').value.trim();
      let content = document.getElementById('postContent').value.trim();
      let author = document.getElementById('postAuthor').value.trim() || '游客';
      if (!title || !content) { alert('标题和内容不能为空'); return; }
      let posts = await getPostsArray();
      let newPost = {
        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
        title: title,
        content: content,
        author: author,
        likes: 0,
        replies: [],
        createdOn: Date.now()
      };
      posts.unshift(newPost);
      let ok = await savePostsArray(posts);
      if (ok) {
        document.getElementById('postTitle').value = '';
        document.getElementById('postContent').value = '';
        goHome();
      } else {
        alert('发布失败');
      }
    }

    async function addReply(postId) {
      let content = document.getElementById('replyContent').value.trim();
      let author = document.getElementById('replyAuthor').value.trim() || '游客';
      if (!content) { alert('回复不能为空'); return; }
      let posts = await getPostsArray();
      let p = posts.find(item => item.id === postId);
      if (!p) { alert('帖子不存在'); return; }
      p.replies = p.replies || [];
      p.replies.push({ content: content, author: author });
      await savePostsArray(posts);
      loadDetail(postId);
    }

    async function likePost(postId) {
      let posts = await getPostsArray();
      let p = posts.find(item => item.id === postId);
      if (!p) return;
      p.likes = (p.likes || 0) + 1;
      await savePostsArray(posts);
      loadDetail(postId);
    }

    async function searchPosts() {
      let keyword = document.getElementById('searchInput').value.trim();
      if (!keyword) { alert('请输入关键词'); return; }
      let posts = await getPostsArray();
      let filtered = posts.filter(function(p) {
        return (p.title && p.title.indexOf(keyword) !== -1) || (p.content && p.content.indexOf(keyword) !== -1);
      });
      let html = '';
      if (!filtered.length) {
        html = '<p class="tip">没有找到相关帖子</p>';
      } else {
        html = '<table><tr><th>标题</th><th>作者</th><th>回复</th><th>赞</th></tr>';
        filtered.forEach(function(p) {
          html += '<tr><td><a class="link" onclick="showDetail(\'' + p.id + '\')">' + esc(p.title) + '</a></td><td>' + esc(p.author) + '</td><td>' + (p.replies ? p.replies.length : 0) + '</td><td>' + (p.likes || 0) + '</td></tr>';
        });
        html += '</table>';
      }
      document.getElementById('searchResults').innerHTML = html;
    }

    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function formatTime(ts) {
      if (!ts) return '';
      var d = new Date(ts);
      return (d.getMonth()+1) + '-' + d.getDate() + ' ' + d.getHours() + ':' + d.getMinutes();
    }

    goHome();
  </script>
</body>
</html>
