<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>论坛</title>
  <style>
    body {
      background: #ffffff;
      font-family: SimSun, "宋体", serif;
      font-size: 14px;
      color: #000000;
      margin: 0;
      padding: 30px 20px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 10px;
      font-weight: bold;
    }
    .back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 28px;
      font-weight: bold;
      color: #0000cc;
      text-decoration: none;
      cursor: pointer;
      line-height: 1;
      padding: 5px 10px;
      border: none;
      background: none;
    }
    .back-btn:hover {
      color: #ff0000;
    }
    .nav {
      text-align: center;
      margin-bottom: 15px;
    }
    .nav a {
      color: #0000cc;
      margin: 0 8px;
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
    }
    .nav a:hover {
      color: #ff0000;
    }
    .search-row {
      text-align: center;
      margin-bottom: 15px;
    }
    .search-row input {
      width: 200px;
      border: 1px solid #999999;
      padding: 3px 5px;
      font-size: 14px;
      font-family: inherit;
      background: #ffffff;
    }
    .search-row button {
      border: 1px solid #999999;
      background: #eeeeee;
      padding: 3px 16px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
    .search-row button:hover {
      background: #dddddd;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #999999;
      background: #ffffff;
      margin-top: 10px;
    }
    th {
      background: #eeeeee;
      border: 1px solid #999999;
      padding: 4px 6px;
      text-align: left;
      font-weight: bold;
    }
    td {
      border: 1px solid #999999;
      padding: 4px 6px;
    }
    .link {
      color: #0000cc;
      text-decoration: underline;
      cursor: pointer;
    }
    .link:hover {
      color: #ff0000;
    }
    .form-label {
      margin-top: 8px;
      margin-bottom: 2px;
    }
    input[type="text"],
    textarea {
      width: 100%;
      border: 1px solid #999999;
      padding: 3px 5px;
      font-size: 14px;
      font-family: inherit;
      background: #ffffff;
      box-sizing: border-box;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }
    button {
      border: 1px solid #999999;
      background: #eeeeee;
      padding: 3px 16px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover {
      background: #dddddd;
    }
    .hidden {
      display: none;
    }
    .tip {
      text-align: center;
      color: #555555;
      padding: 15px;
    }
    .reply-item {
      border-bottom: 1px dashed #999999;
      padding: 6px 0;
    }
    .reply-meta {
      font-size: 12px;
      color: #555555;
    }
    .error-msg {
      background: #ffeeee;
      border: 1px solid #ff9999;
      padding: 10px;
      margin: 10px 0;
      font-size: 13px;
      color: #cc0000;
    }
  </style>
</head>
<body>

  <button class="back-btn hidden" id="backBtn" onclick="goHome()">&#10094;</button>

  <h1>论坛</h1>

  <div class="nav" id="navBar">
    <a href="#" onclick="showNewPost()">发帖</a>
    <a href="#" onclick="showAllPosts()">浏览</a>
  </div>

  <div class="search-row" id="searchRow">
    <input type="text" id="searchInput" placeholder="搜索...">
    <button onclick="searchPosts()">搜索</button>
  </div>

  <div id="resultPanel" class="hidden">
    <div id="resultContent"></div>
  </div>

  <div id="newPostPanel" class="hidden">
    <div class="form-label">标题：</div>
    <input type="text" id="postTitle" maxlength="100">
    <div class="form-label">内容：</div>
    <textarea id="postContent" maxlength="5000"></textarea>
    <div class="form-label">昵称：</div>
    <input type="text" id="postAuthor" maxlength="20" value="游客">
    <div>
      <button onclick="submitPost()">发布</button>
      <button onclick="goHome()">返回</button>
    </div>
  </div>

  <div id="detailPanel" class="hidden">
    <div id="detailContent"></div>
  </div>

  <script>
    // ============================================
    // 把你的 Pantry ID 填在下面
    // ============================================
    var PANTRY_ID = 'CA8D8998-E4F8-40DF-A704-AD1A159647FC';
    // ============================================

    var BASKET = 'posts';
    var API = 'https://getpantry.cloud/apiv1/pantry/' + PANTRY_ID + '/basket/' + BASKET;
    var currentPostId = null;

    // 简单的日志
    console.log('Pantry API 地址：' + API);

    function showError(msg) {
      document.getElementById('resultContent').innerHTML = '<div class="error-msg">' + msg + '</div>';
      document.getElementById('resultPanel').classList.remove('hidden');
    }

    function goHome() {
      document.getElementById('navBar').classList.remove('hidden');
      document.getElementById('searchRow').classList.remove('hidden');
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
    }

    function showNewPost() {
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('searchRow').classList.add('hidden');
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('newPostPanel').classList.remove('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
    }

    function showAllPosts() {
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('searchRow').classList.add('hidden');
      document.getElementById('resultPanel').classList.remove('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      loadAllPosts();
    }

    function showDetail(id) {
      currentPostId = id;
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('searchRow').classList.add('hidden');
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      loadDetail(id);
    }

    async function readData() {
      var res = await fetch(API);
      if (res.status === 404) {
        // 篮子不存在，创建
        var init = { posts: [] };
        await fetch(API, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(init)
        });
        return init;
      }
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      return await res.json();
    }

    async function writeData(data) {
      var res = await fetch(API, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      return true;
    }

    async function loadAllPosts() {
      try {
        var data = await readData();
        var posts = data.posts || [];
        renderPostTable(posts);
      } catch(e) {
        showError('加载失败。错误信息：' + e.message + '<br>请确认：<br>1. Pantry ID 填对了没有<br>2. 这个页面是用 http:// 或 https:// 打开的，不是直接双击文件');
      }
    }

    async function searchPosts() {
      var keyword = document.getElementById('searchInput').value.trim();
      if (!keyword) {
        alert('请输入关键词');
        return;
      }
      try {
        var data = await readData();
        var posts = (data.posts || []).filter(function(p) {
          return p.title.indexOf(keyword) !== -1 || p.content.indexOf(keyword) !== -1;
        });
        document.getElementById('navBar').classList.add('hidden');
        document.getElementById('searchRow').classList.add('hidden');
        document.getElementById('resultPanel').classList.remove('hidden');
        document.getElementById('newPostPanel').classList.add('hidden');
        document.getElementById('detailPanel').classList.add('hidden');
        document.getElementById('backBtn').classList.remove('hidden');
        renderPostTable(posts);
      } catch(e) {
        showError('搜索失败：' + e.message);
      }
    }

    function renderPostTable(posts) {
      var container = document.getElementById('resultContent');
      if (posts.length === 0) {
        container.innerHTML = '<p class="tip">暂无帖子</p>';
        return;
      }
      var html = '<table><thead><tr><th>标题</th><th>作者</th><th>回复</th><th>赞</th><th>时间</th></tr></thead><tbody>';
      posts.forEach(function(p) {
        var replyCount = p.replies ? p.replies.length : 0;
        html += '<tr>' +
          '<td><a href="#" class="link" onclick="showDetail(' + p.id + ')">' + esc(p.title) + '</a></td>' +
          '<td>' + esc(p.author) + '</td>' +
          '<td>' + replyCount + '</td>' +
          '<td>' + (p.likes || 0) + '</td>' +
          '<td>' + formatTime(p.created_at) + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    async function loadDetail(id) {
      try {
        var data = await readData();
        var p = (data.posts || []).find(function(item) { return item.id === id; });
        if (!p) {
          document.getElementById('detailContent').innerHTML = '<p class="tip">帖子不存在</p>';
          return;
        }
        var html = '<h3>' + esc(p.title) + '</h3>' +
          '<p>作者：' + esc(p.author) + ' | 时间：' + formatTime(p.created_at) +
          ' | <a href="#" class="link" onclick="likePost(' + p.id + ')">点赞（' + (p.likes || 0) + '）</a></p>' +
          '<hr>' +
          '<p>' + esc(p.content) + '</p>' +
          '<hr>' +
          '<h4>回复：</h4>';
        if (p.replies && p.replies.length > 0) {
          p.replies.forEach(function(r) {
            html += '<div class="reply-item">' +
              '<div class="reply-meta">' + esc(r.author) + ' | ' + formatTime(r.created_at) + '</div>' +
              '<div>' + esc(r.content) + '</div>' +
              '</div>';
          });
        } else {
          html += '<p class="tip">暂无回复</p>';
        }
        html += '<div class="form-label">回复：</div>' +
          '<input type="text" id="replyContent" maxlength="1000">' +
          '<div class="form-label">昵称：</div>' +
          '<input type="text" id="replyAuthor" maxlength="20" value="游客">' +
          '<div><button onclick="submitReply(' + p.id + ')">提交回复</button></div>';
        document.getElementById('detailContent').innerHTML = html;
      } catch(e) {
        document.getElementById('detailContent').innerHTML = '<p class="tip">加载失败：' + e.message + '</p>';
      }
    }

    async function submitPost() {
      var title = document.getElementById('postTitle').value.trim();
      var content = document.getElementById('postContent').value.trim();
      var author = document.getElementById('postAuthor').value.trim() || '游客';
      if (!title || !content) {
        alert('标题和内容不能为空');
        return;
      }
      try {
        var data = await readData();
        var posts = data.posts || [];
        var newPost = {
          id: Date.now(),
          title: title,
          content: content,
          author: author,
          likes: 0,
          replies: [],
          created_at: Date.now()
        };
        posts.unshift(newPost);
        await writeData({ posts: posts });
        document.getElementById('postTitle').value = '';
        document.getElementById('postContent').value = '';
        goHome();
      } catch(e) {
        alert('发布失败：' + e.message);
      }
    }

    async function submitReply(postId) {
      var content = document.getElementById('replyContent').value.trim();
      var author = document.getElementById('replyAuthor').value.trim() || '游客';
      if (!content) {
        alert('回复不能为空');
        return;
      }
      try {
        var data = await readData();
        var posts = data.posts || [];
        var post = posts.find(function(p) { return p.id === postId; });
        if (!post) {
          alert('帖子不存在');
          return;
        }
        if (!post.replies) post.replies = [];
        post.replies.push({
          content: content,
          author: author,
          created_at: Date.now()
        });
        await writeData({ posts: posts });
        loadDetail(postId);
      } catch(e) {
        alert('回复失败：' + e.message);
      }
    }

    async function likePost(postId) {
      try {
        var data = await readData();
        var posts = data.posts || [];
        var post = posts.find(function(p) { return p.id === postId; });
        if (!post) return;
        post.likes = (post.likes || 0) + 1;
        await writeData({ posts: posts });
        loadDetail(postId);
      } catch(e) {
        alert('点赞失败：' + e.message);
      }
    }

    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatTime(ts) {
      if (!ts) return '';
      var d = new Date(ts);
      var m = (d.getMonth()+1).toString().padStart(2,'0');
      var day = d.getDate().toString().padStart(2,'0');
      var h = d.getHours().toString().padStart(2,'0');
      var min = d.getMinutes().toString().padStart(2,'0');
      return m + '-' + day + ' ' + h + ':' + min;
    }

    goHome();
  </script>
</body>
</html>
