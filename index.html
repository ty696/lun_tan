<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>论坛</title>
  <style>
    body { background:#fff; font-family:SimSun; font-size:14px; margin:0; padding:30px 20px; max-width:700px; margin:auto; }
    h1 { text-align:center; margin-bottom:10px; }
    .nav { text-align:center; margin-bottom:15px; }
    .nav a { color:#00c; margin:0 8px; cursor:pointer; text-decoration:underline; }
    .search-row { text-align:center; margin-bottom:15px; }
    .search-row input { width:320px; border:1px solid #999; padding:4px 8px; font-size:14px; }
    .search-row button { border:1px solid #999; background:#eee; padding:4px 16px; cursor:pointer; font-size:14px; }
    table { width:100%; border-collapse:collapse; border:1px solid #999; margin-top:10px; }
    th,td { border:1px solid #999; padding:4px 6px; text-align:left; }
    .link { color:#00c; text-decoration:underline; cursor:pointer; }
    input,textarea { width:100%; border:1px solid #999; padding:3px; font-size:14px; box-sizing:border-box; }
    button { border:1px solid #999; background:#eee; padding:4px 16px; cursor:pointer; }
    .hidden { display:none; }
    .tip { text-align:center; color:#555; padding:15px; }
    .back-btn { position:absolute; top:15px; left:15px; font-size:28px; cursor:pointer; color:#00c; background:none; border:none; }
    .form-label { margin-top:8px; margin-bottom:2px; }
  </style>
</head>
<body>

  <button class="back-btn hidden" id="backBtn" onclick="goHome()">&#10094;</button>

  <h1>论坛</h1>

  <div class="nav" id="navBar">
    <a href="#" onclick="showNewPost()">发帖</a>
    <a href="#" onclick="showAllPosts()">浏览</a>
  </div>

  <div class="search-row" id="searchRow">
    <input type="text" id="searchInput" placeholder="搜索标题...">
    <button onclick="searchPosts()">搜索</button>
  </div>

  <div id="resultPanel" class="hidden">
    <div id="resultContent"></div>
  </div>

  <div id="newPostPanel" class="hidden">
    <div class="form-label">标题：</div>
    <input type="text" id="postTitle" maxlength="100">
    <div class="form-label">内容：</div>
    <textarea id="postContent" maxlength="5000"></textarea>
    <div class="form-label">昵称：</div>
    <input type="text" id="postAuthor" maxlength="20" value="游客">
    <div style="margin-top:8px;">
      <button onclick="submitPost()">发布</button>
      <button onclick="goHome()">返回</button>
    </div>
  </div>

  <div id="detailPanel" class="hidden">
    <div id="detailContent"></div>
  </div>

  <script>
    // ========== 改成你的 KVdb Bucket ID ==========
    var BUCKET_ID = 'kvdb-你的ID';
    var API = 'https://kvdb.io/' + BUCKET_ID + '/posts';
    // =============================================

    var currentPostId = null;

    function goHome() {
      document.getElementById('navBar').classList.remove('hidden');
      document.getElementById('searchRow').classList.remove('hidden');
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
    }

    function showNewPost() {
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('searchRow').classList.add('hidden');
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('newPostPanel').classList.remove('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
    }

    function showAllPosts() {
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('searchRow').classList.add('hidden');
      document.getElementById('resultPanel').classList.remove('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      loadPosts();
    }

    function showDetail(id) {
      currentPostId = id;
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('searchRow').classList.add('hidden');
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      loadDetail(id);
    }

    function searchPosts() {
      var keyword = document.getElementById('searchInput').value.trim();
      if (!keyword) { alert('请输入关键词'); return; }
      document.getElementById('navBar').classList.add('hidden');
      document.getElementById('searchRow').classList.add('hidden');
      document.getElementById('resultPanel').classList.remove('hidden');
      document.getElementById('newPostPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      loadPosts(keyword);
    }

    async function loadPosts(keyword) {
      try {
        var res = await fetch(API);
        if (!res.ok) throw new Error();
        var posts = await res.json();
        posts = posts || [];
        posts.sort(function(a,b){ return (b.createdOn||0) - (a.createdOn||0); });
        if (keyword) {
          posts = posts.filter(function(p) {
            return (p.title && p.title.indexOf(keyword) !== -1) || (p.content && p.content.indexOf(keyword) !== -1);
          });
        }
        renderList(posts);
      } catch(e) {
        document.getElementById('resultContent').innerHTML = '<p class="tip">加载失败，请检查 Bucket ID 是否正确</p>';
      }
    }

    function renderList(posts) {
      var container = document.getElementById('resultContent');
      if (!posts.length) {
        container.innerHTML = '<p class="tip">暂无帖子</p>';
        return;
      }
      var html = '<table><tr><th>标题</th><th>作者</th><th>回复</th><th>赞</th><th>时间</th></tr>';
      posts.forEach(function(p) {
        html += '<tr><td><a class="link" onclick="showDetail(\'' + p._id + '\')">' + esc(p.title) + '</a></td><td>' + esc(p.author) + '</td><td>' + (p.replies ? p.replies.length : 0) + '</td><td>' + (p.likes || 0) + '</td><td>' + formatTime(p.createdOn) + '</td></tr>';
      });
      html += '</table>';
      container.innerHTML = html;
    }

    async function loadDetail(id) {
      try {
        var res = await fetch(API + '/' + id);
        var p = await res.json();
        var html = '<h3>' + esc(p.title) + '</h3><p>作者：' + esc(p.author) + ' | 时间：' + formatTime(p.createdOn) + ' | <a class="link" onclick="likePost(\'' + id + '\')">点赞（' + (p.likes||0) + '）</a></p><hr><p>' + esc(p.content) + '</p><hr><h4>回复：</h4>';
        if (p.replies && p.replies.length) {
          p.replies.forEach(function(r) {
            html += '<div><b>' + esc(r.author) + ':</b> ' + esc(r.content) + '</div>';
          });
        } else {
          html += '<p class="tip">暂无回复</p>';
        }
        html += '<div class="form-label">回复：</div><input type="text" id="replyContent"><div class="form-label">昵称：</div><input type="text" id="replyAuthor" value="游客"><div style="margin-top:8px;"><button onclick="addReply(\'' + id + '\')">提交回复</button></div>';
        document.getElementById('detailContent').innerHTML = html;
      } catch(e) {
        document.getElementById('detailContent').innerHTML = '<p class="tip">加载失败</p>';
      }
    }

    async function submitPost() {
      var title = document.getElementById('postTitle').value.trim();
      var content = document.getElementById('postContent').value.trim();
      var author = document.getElementById('postAuthor').value.trim() || '游客';
      if (!title || !content) { alert('标题和内容不能为空'); return; }
      var postData = {
        title: title,
        content: content,
        author: author,
        likes: 0,
        replies: [],
        createdOn: Date.now()
      };
      try {
        await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(postData)
        });
        document.getElementById('postTitle').value = '';
        document.getElementById('postContent').value = '';
        goHome();
      } catch(e) {
        alert('发布失败');
      }
    }

    async function addReply(id) {
      var content = document.getElementById('replyContent').value.trim();
      var author = document.getElementById('replyAuthor').value.trim() || '游客';
      if (!content) { alert('回复不能为空'); return; }
      try {
        var res = await fetch(API + '/' + id);
        var post = await res.json();
        post.replies = post.replies || [];
        post.replies.push({ content: content, author: author });
        await fetch(API + '/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(post)
        });
        loadDetail(id);
      } catch(e) {
        alert('回复失败');
      }
    }

    async function likePost(id) {
      try {
        var res = await fetch(API + '/' + id);
        var post = await res.json();
        post.likes = (post.likes || 0) + 1;
        await fetch(API + '/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(post)
        });
        loadDetail(id);
      } catch(e) {
        alert('点赞失败');
      }
    }

    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function formatTime(ts) {
      if (!ts) return '';
      var d = new Date(ts);
      return (d.getMonth()+1) + '-' + d.getDate() + ' ' + d.getHours() + ':' + d.getMinutes();
    }

    goHome();
  </script>
</body>
</html>
